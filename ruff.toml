extend-exclude = [
  "deprecated",
  "evaluation",
  "UI",
  "full_workflow_evaluation.py",
  "pgadmin",
  "pgdata"
]

line-length = 120

# Assume Python 3.13
target-version = "py313"

[lint]
select = [
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # isort
  "PGH",  # pygrep-hooks
  "RUF",  # ruff
  "UP",   # pyupgrade
  "W",    # pycodestyle
  "YTT",  # flake8-2020
]

[format]
quote-style = "single"
